name: Build Ghiyabat APK and EXE
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with: 
          node-version: 20
          
      - name: Prepare desktop project
        run: node tools/prepare-desktop.js
      
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      
      - uses: actions/upload-artifact@v4
        with:
          name: ghiyabat-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with: 
          node-version: 20
          
      - uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: 17
          
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          
      - name: Install Capacitor and embedded Node runtime
        run: |
          npm install
          npm install https://github.com/hampoelz/capacitor-nodejs/releases/download/v1.0.0-beta.8/capacitor-nodejs.tgz
          
      - name: Prepare embedded server
        run: |
          node tools/prepare-android.js pre
          cd www/nodejs
          npm install --omit=dev
          cd ../..
          
      - name: Add Android platform and sync
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
          
      - name: Patch Android service
        run: |
          node tools/prepare-android.js post
          npx cap sync android
          
      - name: Fix gradlew permissions
        run: chmod +x android/gradlew
      
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ghiyabat.apk
      
      - uses: actions/upload-artifact@v4
        with:
          name: ghiyabat-android
          path: Ghiyabat.apk
          if-no-files-found: error

  release:
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: 
          path: out
          
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ghiyabat Build ${{ github.run_number }}
          files: |
            out/ghiyabat-windows/*.exe
            out/ghiyabat-android/Ghiyabat.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
