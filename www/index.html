<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسيير غيابات التلاميذ | الإدارة والتخزين</title>

<style>
:root{
  --bg:#eef3fa; --bg2:#e3ebf6;
  --fg:#152238; --card:#ffffff;
  --ac:#1b6fb8; --ac2:#0f4d84; --ac3:#2f8fe0;
  --bd:#d7e2ef; --bd2:#c3d4e6;
  --red:#c8303f; --red2:#a8222f;
  --ok:#1e8a4c; --warn:#c47a00;
  --muted:#6b7c93; --soft:#eaf2fb; --soft2:#f4f8fd;
  --shadow:0 10px 30px rgba(20,50,85,.08);
  --shadow2:0 4px 14px rgba(20,50,85,.10);
  --radius:16px; --radius-sm:10px;
  --focus:0 0 0 3px rgba(27,111,184,.22);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f1722; --bg2:#131e2c;
    --fg:#e7eef8; --card:#1a2636;
    --ac:#5aa6e6; --ac2:#3d86c6; --ac3:#7cbcf0;
    --bd:#2f3f55; --bd2:#3a4c66;
    --red:#ff6b76; --red2:#e5545f;
    --ok:#4cc47f; --warn:#f0a93a;
    --muted:#9fb0c6; --soft:#22344a; --soft2:#1d2c3f;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --shadow2:0 4px 14px rgba(0,0,0,.35);
    --focus:0 0 0 3px rgba(90,166,230,.28);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  color:var(--fg); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------- شريط التنقل ---------- */
nav{
  display:flex; gap:6px; overflow-x:auto;
  background:linear-gradient(120deg,var(--ac2),var(--ac) 60%,var(--ac3));
  padding:12px max(14px,calc((100% - 1200px)/2));
  position:sticky; top:0; z-index:20;
  box-shadow:0 6px 22px rgba(15,77,132,.28);
  scrollbar-width:thin;
  backdrop-filter:saturate(1.1);
}
nav::-webkit-scrollbar{height:6px}
nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:99px}
nav button{
  white-space:nowrap; border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06); color:#fff;
  border-radius:999px; padding:9px 15px; font-weight:600;
  font-size:14px; letter-spacing:.2px;
  transition:all .18s ease;
  box-shadow:0 2px 0 rgba(0,0,0,.04);
}
nav button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
nav button.on{
  background:#fff; color:var(--ac2); border-color:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
  font-weight:800;
}

/* ---------- الحاوية ---------- */
main{
  padding:24px 16px 48px; max-width:1200px; margin:auto;
  min-height:calc(100vh - 60px);
}

/* ---------- البطاقات ---------- */
.card{
  background:var(--card); border:1px solid var(--bd);
  border-radius:var(--radius); padding:20px; margin-bottom:16px;
  box-shadow:var(--shadow); overflow:hidden;
  position:relative;
}
.card::before{
  content:""; position:absolute; inset:0 auto auto 0;
  width:100%; height:3px;
  background:linear-gradient(90deg,var(--ac),var(--ac3),transparent);
  opacity:.55;
}
.card>b{
  display:block; color:var(--ac2); font-size:16px; font-weight:800;
  margin-bottom:12px; padding-bottom:8px;
  border-bottom:1px dashed var(--bd);
}
.card p{color:var(--muted);margin:.4em 0}
.card small{color:var(--muted)}

/* ---------- الحقول والأزرار ---------- */
button,input,select{
  font:inherit; padding:9px 12px;
  border:1px solid var(--bd2); border-radius:var(--radius-sm);
  background:var(--card); color:var(--fg);
  max-width:100%; transition:all .16s ease;
}
input::placeholder{color:var(--muted);opacity:.8}
input:hover,select:hover{border-color:var(--ac)}
input:focus,select:focus{
  outline:none; border-color:var(--ac); box-shadow:var(--focus);
}
button{cursor:pointer;font-weight:600;letter-spacing:.15px}
button:hover{border-color:var(--ac);box-shadow:var(--shadow2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

/* الزر الأساسي */
button.p{
  background:linear-gradient(180deg,var(--ac),var(--ac2));
  color:#fff; border-color:var(--ac2);
  box-shadow:0 4px 12px rgba(27,111,184,.28);
}
button.p:hover{filter:brightness(1.06);box-shadow:0 6px 16px rgba(27,111,184,.35)}

/* أزرار صغيرة للأيقونات */
button.h{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:34px;height:34px;padding:0 8px;margin:2px;
  border-radius:8px;font-weight:700;font-size:13px;
}
button.h.a{background:linear-gradient(180deg,var(--red),var(--red2));color:#fff;border-color:var(--red2)}
button.h.l{background:linear-gradient(180deg,#f0a93a,#c47a00);color:#fff;border-color:#c47a00}
button.h.x{opacity:.3;pointer-events:none}

/* ---------- الشبكات ---------- */
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}

/* ---------- الجداول ---------- */
.t{overflow:auto;border:1px solid var(--bd);border-radius:12px;margin-top:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:540px;background:var(--card)}
td,th{
  border-bottom:1px solid var(--bd);
  border-left:1px solid var(--bd);
  padding:9px 9px;text-align:center;font-size:13px;
}
th{
  background:linear-gradient(180deg,var(--soft),var(--soft2));
  color:var(--ac2);font-weight:800;white-space:nowrap;
  position:sticky;top:0;z-index:1;
}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:var(--soft2)}
tbody tr:hover td,table tr:hover td{background:var(--soft)}

/* ---------- التواقيع ---------- */
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:26px;text-align:center}
.sig>div{
  padding:16px;border:1px dashed var(--bd2);border-radius:12px;
  background:var(--soft2);font-weight:600;color:var(--ac2);
}

/* ---------- الحالة والمربعات ---------- */
#sy{
  padding:10px 14px;border-radius:10px;
  background:var(--soft);color:var(--ac2);font-weight:700;
  border-left:4px solid var(--ac);
}
input[type=checkbox]{accent-color:var(--ac);width:17px;height:17px;vertical-align:middle;cursor:pointer}
input[type=date],input[type=month]{min-width:148px}

/* ---------- خلايا الأيام ---------- */
.daycell{
  cursor:pointer;min-width:30px;padding:6px 4px!important;
  user-select:none;border-radius:6px;font-weight:700;
  transition:all .12s ease;
}
.daycell:hover{outline:2px solid var(--ac);outline-offset:-2px;transform:scale(1.05)}
.daycell.absent{background:#f8c8cb!important;color:#9b1522}
.daycell.jus{background:#cfe9d4!important;color:#1b6b34}
.daycell.late{background:#ffe3ae!important;color:#8a5200}

/* ---------- شريط التقدم والإحصاءات ---------- */
.bar{height:14px;background:linear-gradient(90deg,var(--ac),var(--ac3));border-radius:99px;transition:width .4s ease}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.k>div{
  background:linear-gradient(180deg,var(--soft),var(--soft2));
  border-radius:14px;padding:14px;text-align:center;
  border:1px solid var(--bd);
  transition:transform .18s ease,box-shadow .18s ease;
}
.k>div:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.k b{display:block;font-size:22px;color:var(--ac2);font-weight:800}
.k span{font-size:12px;color:var(--muted);font-weight:600}

/* ---------- الاستجابة ---------- */
@media(max-width:650px){
  main{padding:12px 9px 32px}
  .card{padding:14px;border-radius:12px}
  nav{padding:9px;gap:5px}
  nav button{padding:8px 11px;font-size:13px}
  .g{grid-template-columns:1fr 1fr;gap:8px}
  .r{gap:6px}
  button,input,select{padding:8px 10px;font-size:14px}
  .card>b{font-size:15px}
  .daycell{min-width:25px;padding:4px 2px!important;font-size:11px!important}
  .k>div{padding:10px}
  .k b{font-size:18px}
}
@media(max-width:390px){
  .g{grid-template-columns:1fr}
  nav button{font-size:12px;padding:7px 9px}
}

/* ---------- الطباعة ---------- */
@media print{
  nav,.np{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  main{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:4px}
  .card::before{display:none}
  .t{overflow:visible;border:0}
  table{min-width:0}
  td,th{padding:3px;font-size:10px}
  th{position:static;background:#f0f0f0}
}
</style>
</head>
<body>
<nav id="nav"></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s);
const WILAYAS=["أدرار", "الشلف", "الأغواط", "أم البواقي", "باتنة", "بجاية", "بسكرة", "بشار", "البليدة", "البويرة", "تمنراست", "تبسة", "تلمسان", "تيارت", "تيزي وزو", "الجزائر", "الجلفة", "جيجل", "سطيف", "سعيدة", "سكيكدة", "سيدي بلعباس", "عنابة", "قالمة", "قسنطينة", "المدية", "مستغانم", "المسيلة", "معسكر", "ورقلة", "وهران", "البيض", "إليزي", "برج بوعريريج", "بومرداس", "الطارف", "تندوف", "تيسمسيلت", "الوادي", "خنشلة", "سوق أهراس", "تيبازة", "ميلة", "عين الدفلى", "النعامة", "عين تموشنت", "غرداية", "غليزان", "تيميمون", "برج باجي مختار", "أولاد جلال", "بني عباس", "عين صالح", "عين قزام", "تقرت", "جانت", "المغير", "المنيعة", "أفلو", "بريكة", "القنطرة", "بئر العاتر", "العريشة", "قصر الشلالة", "عين وسارة", "مسعد", "قصر البخاري", "بوسعادة", "الأبيض سيدي الشيخ"];
const def={set:{year:'2026/2027',school:'',wilaya:'',baladiya:'',dir:'',nad:'',ma:'',mr:'',mt:''},terms:[{n:'الفصل 1',a:'',b:''},{n:'الفصل 2',a:'',b:''},{n:'الفصل 3',a:'',b:''}],hol:[],cls:[],st:[],tt:{},cx:{},ab:{},ju:{},lt:{},tp:{},tc:[],nl:[],cdTh:[3,5,8],cdWk:true,lr:3};
const mk=()=>JSON.parse(JSON.stringify(def));
function norm(){D.th=D.th||[6,12,18];D.cdTh=D.cdTh||[3,5,8];if(D.cdWk===undefined)D.cdWk=true;D.lr=D.lr||3;D.set=D.set||{};D.terms=D.terms||mk().terms;['ab','ju','lt','tp','cx','tt'].forEach(k=>D[k]=D[k]||{});['nl','tc','st','cls','hol'].forEach(k=>D[k]=D[k]||[])}
let D;try{D=Object.assign(mk(),JSON.parse(localStorage.getItem('abs3'))||{})}catch(e){D=mk()}
norm();
let token=localStorage.getItem('gh_token')||'', user=null, tmr=null, pollTimer=null, syncing=false, msg='غير متصل بالسيرفر';
const api=async(url,opts={})=>{const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;const native=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());const base=native?'http://127.0.0.1:8787':'';const r=await fetch(base+url,{...opts,headers});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j};
const save=()=>{localStorage.setItem('abs3',JSON.stringify(D));push()};
function push(){if(!token)return;clearTimeout(tmr);tmr=setTimeout(async()=>{try{const x=await api('/api/state',{method:'PUT',body:JSON.stringify({state:D})});window._lastServerUpdate=x.updatedAt;msg='تم الحفظ على السيرفر '+new Date().toLocaleTimeString();setStatus()}catch(e){msg='تعذر الحفظ على السيرفر: '+e.message;setStatus()}},500)}
function setStatus(){const e=document.getElementById('sy');if(e)e.textContent=msg}
async function pull(){const r=await api('/api/state');if(r.state&&r.state.data){D=Object.assign(mk(),r.state.data);norm();localStorage.setItem('abs3',JSON.stringify(D));window._lastServerUpdate=r.updatedAt;msg='تم تحميل البيانات من السيرفر'}else{msg='لا توجد بيانات على السيرفر؛ تم رفع بيانات هذا الجهاز';const x=await api('/api/state',{method:'PUT',body:JSON.stringify({state:D})});window._lastServerUpdate=x.updatedAt}R();setStatus()}
async function login(){try{const username=$('#loginUser').value.trim(),password=$('#loginPass').value;const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username,password})});token=r.token;user=r.user;localStorage.setItem('gh_token',token);await pull();startPolling()}catch(e){alert(e.message)}}
async function setupAdmin(){try{const username=$('#setupUser').value.trim(),password=$('#setupPass').value;const r=await api('/api/auth/setup',{method:'POST',body:JSON.stringify({username,password})});token=r.token;user=r.user;localStorage.setItem('gh_token',token);await pull();startPolling()}catch(e){alert(e.message)}}
async function logout(){try{await api('/api/auth/logout',{method:'POST',body:'{}'})}catch{}token='';user=null;localStorage.removeItem('gh_token');clearInterval(pollTimer);msg='تم تسجيل الخروج';R()}
async function initServer(){try{const st=await api('/api/auth/status');if(!token){renderGate(st.setupRequired);return}const me=await api('/api/auth/me');user=me.user;await pull();startPolling()}catch(e){token='';localStorage.removeItem('gh_token');renderGate(false,e.message)}}
function renderGate(setup,error=''){document.querySelector('#nav').innerHTML='';document.querySelector('#m').innerHTML=`<div class="card" style="max-width:520px;margin:8vh auto"><h2 style="color:var(--ac);margin-top:0">تسيير غيابات التلاميذ</h2><p>تسجيل الدخول إلى السيرفر المحلي وتخزين بيانات المؤسسة مركزيًا.</p>${error?`<p style="color:var(--red)">${esc(error)}</p>`:''}${setup?`<b>الإعداد لأول مرة — إنشاء حساب المسؤول</b><label>اسم المستخدم (3 أحرف على الأقل)</label><input id="setupUser" autocomplete="username" style="width:100%" placeholder="admin"><label style="margin-top:10px">كلمة المرور (8 أحرف على الأقل)</label><input id="setupPass" type="password" autocomplete="new-password" style="width:100%"><div class="r"><button class="p" onclick="setupAdmin()">إنشاء حساب المسؤول</button></div>`:`<b>تسجيل الدخول</b><label>اسم المستخدم</label><input id="loginUser" autocomplete="username" style="width:100%"><label style="margin-top:10px">كلمة المرور</label><input id="loginPass" type="password" autocomplete="current-password" style="width:100%" onkeydown="if(event.key==='Enter')login()"><div class="r"><button class="p" onclick="login()">دخول</button></div>`}<p style="font-size:12px">تأكد أن نافذة السيرفر مفتوحة على الجهاز الرئيسي. أنشئ حساب المسؤول مرة واحدة عند أول تشغيل.</p></div>`}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(async()=>{if(!token||syncing)return;try{syncing=true;const r=await api('/api/state');if(r.state&&r.state.data&&r.updatedAt&&r.updatedAt!==window._lastServerUpdate){const local=JSON.parse(localStorage.getItem('abs3')||'{}');if(JSON.stringify(local)!==JSON.stringify(r.state.data)){D=Object.assign(mk(),r.state.data);norm();localStorage.setItem('abs3',JSON.stringify(D));msg='تم تحديث البيانات من السيرفر';R()}window._lastServerUpdate=r.updatedAt;setStatus()}}catch(e){msg='انقطع الاتصال بالسيرفر';setStatus()}finally{syncing=false}},3000)}
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],HR=[1,2,3,4,5,6,7,8,9];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dt=s=>new Date(s+'T00:00');
const today=iso(new Date());
let tab=0,S={cls:'',date:today,per:'month',mon:today.slice(0,7),mm:'abs',q:''};
const TABS=['الرئيسية','الإعدادات','الأقسام والتلاميذ','استعمال الزمن','التسجيل اليومي','التقارير','الكشف الشهري','الإشعارات'];
const ALLOW=[0,5,7];
const LV=['','إشعار أول','إنذار','استدعاء الولي'];
const PERS=[['day','يومي'],['week','أسبوعي'],['month','شهري'],['term','فصلي'],['year','سنوي']];
const isHol=s=>D.hol.some(h=>h.a&&h.b&&s>=h.a&&s<=h.b);
const sched=(c,s)=>isHol(s)?[]:((D.tt[c]||{})[dt(s).getDay()]||[]);
const held=(c,s)=>{const x=((D.cx[s]||{})[c])||[];return sched(c,s).filter(h=>!x.includes(h))};
const act=()=>D.st.filter(s=>!s.x);
const jus=(d,id)=>!!((D.ju[d]||{})[id]||{}).j;
const isLate=(d,id)=>!!((D.lt[d]||{})[id]);
function rng(a,b){const r=[];for(let d=dt(a);iso(d)<=b;d.setDate(d.getDate()+1))r.push(iso(d));return r}
function period(){
 const d=S.date,x=dt(d);
 if(S.per=='day')return[d,d];
 if(S.per=='week'){const a=new Date(x);a.setDate(x.getDate()-x.getDay());const b=new Date(a);b.setDate(a.getDate()+6);return[iso(a),iso(b)]}
 if(S.per=='month'){const y=x.getFullYear(),m=x.getMonth();return[iso(new Date(y,m,1)),iso(new Date(y,m+1,0))]}
 if(S.per=='term'){const t=D.terms.find(t=>t.a&&t.b&&d>=t.a&&d<=t.b);return t?[t.a,t.b]:[d,d]}
 const y=parseInt(D.set.year)||x.getFullYear();return[y+'-09-01',(y+1)+'-08-31']}
// ---- حساب الغياب: الكلي / المبرر / غير المبرر / التأخرات / الأيام المتتالية
function absSplit(id,c,dates){let t=0,j=0,l=0;dates.forEach(d=>{const a=(D.ab[d]||{})[id];if(a){const hh=held(c,d),k=a.filter(h=>hh.includes(h)).length;t+=k;if(jus(d,id))j+=k}if(isLate(d,id)&&sched(c,d).length)l++});return{t,j,u:t-j,l,eq:Math.floor(l/(D.lr||3))}}
function streak(id,c,dates){let best=0,cur=0,gap=0;for(const d of dates){if(!held(c,d).length){gap++;continue}const a=(D.ab[d]||{})[id]||[],hh=held(c,d),ab=a.some(h=>hh.includes(h))&&!jus(d,id);if(ab){cur=cur?cur+1+(D.cdWk?gap:0):1;if(cur>best)best=cur}else cur=0;gap=0}return best}
const lvH=n=>D.th[2]>0&&n>=D.th[2]?3:D.th[1]>0&&n>=D.th[1]?2:D.th[0]>0&&n>=D.th[0]?1:0;
const lvD=n=>D.cdTh[2]>0&&n>=D.cdTh[2]?3:D.cdTh[1]>0&&n>=D.cdTh[1]?2:D.cdTh[0]>0&&n>=D.cdTh[0]?1:0;
function stat(s,ds){const x=absSplit(s.id,s.c,ds),sk=streak(s.id,s.c,ds),h=x.u+x.eq;return{...x,streak:sk,h,lv:Math.max(lvH(h),lvD(sk))}}
const heldN=(c,dates)=>dates.reduce((n,d)=>n+held(c,d).length,0);
const schedN=(c,dates)=>dates.reduce((n,d)=>n+sched(c,d).length,0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clsSel=(all)=>`<select id="cs">${all?`<option value="" ${!S.cls?'selected':''}>كل الأقسام</option>`:''}${D.cls.map(c=>`<option ${c==S.cls?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
const perBar=(all)=>`الفترة: <select onchange="S.per=this.value;R()">${PERS.map(([k,l])=>`<option value="${k}" ${S.per==k?'selected':''}>${l}</option>`).join('')}</select><input type="date" value="${S.date}" onchange="S.date=this.value;R()">${all===undefined?'':' القسم: '+clsSel(all)}`;
function nav(){$('#nav').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};R()">${t}</button>`).join('')}
function R(){if(!token){renderGate(false);return}nav();if(!S.cls&&D.cls.length&&!ALLOW.includes(tab))S.cls=D.cls[0];[vH,v0,v1,v2,v3,v4,v5,v6][tab]();

function vH(){
 const [a,b]=period(),ds=rng(a,b),cl=S.cls?[S.cls]:D.cls,A=act().filter(s=>cl.includes(s.c)),sm={};A.forEach(s=>sm[s.id]=s);
 let T=0,J=0,Lt=0;const wd=[0,0,0,0,0,0,0],per={},cr={};
 ds.forEach(d=>{const ab=D.ab[d]||{};for(const id in ab){const s=sm[id];if(!s)continue;const hh=held(s.c,d),k=ab[id].filter(h=>hh.includes(h)).length;if(!k)continue;T+=k;if(jus(d,id))J+=k;wd[dt(d).getDay()]+=k;per[id]=(per[id]||0)+k;cr[s.c]=(cr[s.c]||0)+k}const lt=D.lt[d]||{};for(const id in lt){const s=sm[id];if(s&&sched(s.c,d).length)Lt++}});
 let pos=0;const crow=cl.map(c=>{const n=A.filter(s=>s.c==c).length,H=heldN(c,ds),tot=n*H;pos+=tot;const ab=cr[c]||0;return{c,n,H,ab,p:tot?ab/tot*100:0}}).sort((x,y)=>y.p-x.p);
 const rate=pos?((pos-T)/pos*100).toFixed(1):'—';
 const nn=[0,0,0,0];A.forEach(s=>nn[stat(s,ds).lv]++);
 const top=Object.entries(per).sort((x,y)=>y[1]-x[1]).slice(0,10),wmax=Math.max(1,...wd),ta=tAbs(ds,cl);
 $('#m').innerHTML=`<div class="card np"><div class="r">${perBar(true)}</div><b>${a} → ${b}</b></div>
 <div class="card"><div class="k"><div><b>${A.length}</b><span>تلميذ متمدرس</span></div><div><b>${T}</b><span>ساعات الغياب</span></div><div><b>${T-J}</b><span>غير مبررة</span></div><div><b>${J}</b><span>مبررة</span></div><div><b>${Lt}</b><span>تأخرات</span></div><div><b>${rate}${rate=='—'?'':'%'}</b><span>نسبة الحضور</span></div><div><b>${nn[1]+nn[2]+nn[3]}</b><span>حالات تستوجب إشعارًا</span></div></div>
 ${nn[1]+nn[2]+nn[3]?`<p style="margin-bottom:0">إشعار أول: <b>${nn[1]}</b> — إنذار: <b>${nn[2]}</b> — استدعاء الولي: <b>${nn[3]}</b> <button onclick="tab=7;R()">فتح الإشعارات</button></p>`:''}</div>
 <div class="card"><b>أكثر 10 تلاميذ غيابًا (ساعات)</b><div class="t"><table><tr><th>#</th><th>التلميذ</th><th>القسم</th><th>الساعات</th></tr>${top.map(([id,n],i)=>`<tr><td>${i+1}</td><td style="text-align:right">${esc(sm[id].n)}</td><td>${esc(sm[id].c)}</td><td><b>${n}</b></td></tr>`).join('')||'<tr><td colspan=4>لا غيابات</td></tr>'}</table></div></div>
 <div class="card"><b>الأقسام حسب نسبة الغياب</b><div class="t"><table><tr><th>القسم</th><th>التلاميذ</th><th>ساعات الغياب</th><th>نسبة الغياب</th></tr>${crow.map(x=>`<tr><td>${esc(x.c)}</td><td>${x.n}</td><td>${x.ab}</td><td><b>${x.p.toFixed(2)}%</b></td></tr>`).join('')||'<tr><td colspan=4>لا توجد أقسام</td></tr>'}</table></div></div>
 <div class="card"><b>توزيع الغياب على أيام الأسبوع</b>${[0,1,2,3,4,6].map(d=>`<div class="r" style="flex-wrap:nowrap"><span style="min-width:70px">${DAYS[d]}</span><div style="flex:1"><div class="bar" style="width:${Math.max(wd[d]/wmax*100,wd[d]?2:0)}%"></div></div><b style="min-width:36px">${wd[d]}</b></div>`).join('')}</div>
 ${ta.length?`<div class="card"><b>ساعات غياب الأساتذة (لم تُدرَّس)</b><div class="t"><table><tr><th>الأستاذ</th><th>الساعات</th></tr>${ta.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}</td></tr>`).join('')}</table></div></div>`:''}`}
// ---- الكشف الشهري
function head(){const s=D.set;return`<div style="text-align:center"><b>${esc(s.school)}</b> — ${esc(s.baladiya)} / ${esc(s.wilaya)}<br>السنة الدراسية: ${esc(s.year)}</div>`}
function cellClick(id,d){
 if(S.mm=='late'){if(sched(S.cls,d).length)ltSet(id,d);return}
 if(S.mm=='jus'){const hh=held(S.cls,d),a=(D.ab[d]||{})[id]||[];if(!a.some(h=>hh.includes(h)))return;juSet(id,'j',jus(d,id)?'':'1',d);return}
 toggleDayAbs(id,d)}
function toggleDayAbs(id,date){const c=S.cls,hs=sched(c,date),old=(D.ab[date]||{})[id]||[],allAbsent=hs.length>0&&hs.every(h=>old.includes(h));D.ab[date]=D.ab[date]||{};if(allAbsent){delete D.ab[date][id];if(D.ju[date])delete D.ju[date][id]}else D.ab[date][id]=[...new Set([...old,...hs])];save();R()}
function monData(){
 const c=S.cls,m=S.mon,[y,mo]=m.split('-').map(Number),n=new Date(y,mo,0).getDate(),ds=rng(m+'-01',m+'-'+String(n).padStart(2,'0')),L=act().filter(s=>s.c==c);
 const H=heldN(c,ds);let tab_=0,jt=0,lt=0;
 const rows=L.map(s=>{let sum=0,sj=0,sl=0;const cells=ds.map(d=>{const a=(D.ab[d]||{})[s.id]||[],hh=held(c,d),k=a.filter(h=>hh.includes(h)).length,sc=sched(c,d).length,j=jus(d,s.id),late=isLate(d,s.id)&&sc>0;sum+=k;if(j)sj+=k;if(late&&!k)sl++;const kind=k?(j?'jus':'absent'):late?'late':'';return{d,k,kind,t:k?(j?'م':'غ'):late?'ت':(sc?'✓':'—')}});tab_+=sum;jt+=sj;lt+=sl;return{s,cells,sum,sj,sl}});
 return{c,m,ds,L,H,rows,ab_:tab_,jt,lt,tot:L.length*H}}
function v5(){
 const{c,m,ds,H,rows,ab_,jt,lt,tot}=monData();
 const eff=tot-ab_,pa=tot?(eff/tot*100).toFixed(2):'0',pb=tot?(ab_/tot*100).toFixed(2):'0';
 const tr=rows.map(({s,cells,sum,sj,sl},i)=>`<tr><td>${i+1}</td><td style="text-align:right;white-space:nowrap">${esc(s.n)}</td>${cells.map(x=>`<td class="daycell ${x.kind}" title="${x.d}: ${x.k?'غائب '+x.k+' ساعة'+(x.kind=='jus'?' (مبرر)':''):x.kind=='late'?'متأخر':'لا يوجد غياب مسجل'}" onclick="cellClick('${s.id}','${x.d}')">${x.t}</td>`).join('')}<td><b>${sum}</b></td><td>${sj||''}</td><td>${sl||''}</td></tr>`).join('');
 $('#m').innerHTML=`<div class="card np"><div class="r">القسم: ${clsSel(false)}<input type="month" value="${m}" onchange="S.mon=this.value;R()">الضغط على الخانة يسجّل: <select onchange="S.mm=this.value;R()"><option value="abs" ${S.mm=='abs'?'selected':''}>غياب اليوم</option><option value="late" ${S.mm=='late'?'selected':''}>تأخر</option><option value="jus" ${S.mm=='jus'?'selected':''}>تبرير غياب</option></select><button class="p" onclick="print()">طباعة</button><button onclick="expMon()">تصدير Excel</button></div></div>
 <div class="card">${head()}<h3 style="text-align:center">سجل الحضور والغياب اليومي — القسم ${esc(c)} — شهر ${m}</h3><p style="text-align:center">غ = غائب، م = غياب مبرر، ت = تأخر، ✓ = لا يوجد غياب مسجل، — = لا حصص مبرمجة.</p>
 <div class="t"><table><tr><th>#</th><th>الاسم</th>${ds.map(d=>`<th>${+d.slice(8)}</th>`).join('')}<th>المجموع</th><th>مبرر</th><th>تأخر</th></tr>${tr}<tr><td colspan="2">الساعات المدرَّسة</td>${ds.map(d=>`<td>${held(c,d).length||''}</td>`).join('')}<td><b>${H}</b></td><td></td><td></td></tr></table></div>
 <table style="margin-top:10px;max-width:460px"><tr><td>الحضور الكلي (تلاميذ × ساعات)</td><td>${tot}</td></tr><tr><td>عدد ساعات الغياب</td><td>${ab_}</td></tr><tr><td>منها مبررة / غير مبررة</td><td>${jt} / ${ab_-jt}</td></tr><tr><td>عدد التأخرات</td><td>${lt}</td></tr><tr><td>الحضور الفعلي</td><td>${eff}</td></tr><tr><td>النسبة % للحضور = (الحضور الفعلي ÷ الحضور الكلي) × 100</td><td><b>${pa}%</b></td></tr><tr><td>النسبة % للغياب</td><td><b>${pb}%</b></td></tr></table>
 <div class="sig"><div>المشرف التربوي<br>${esc(D.set.mt)}</div><div>المشرف الرئيسي<br>${esc(D.set.mr)}</div><div>المشرف العام<br>${esc(D.set.ma)}</div><div>الناظر<br>${esc(D.set.nad)}</div><div>المدير<br>${esc(D.set.dir)}</div></div></div>`}
function expMon(){const{c,m,ds,H,rows}=monData();const hdr=['#','الاسم',...ds.map(d=>+d.slice(8)),'المجموع','مبرر','تأخر'];exportSheets(`كشف_${m}_${c}`,[{n:'الكشف الشهري',rows:[hdr,...rows.map(({s,cells,sum,sj,sl},i)=>[i+1,s.n,...cells.map(x=>x.t),sum,sj,sl]),['','الساعات المدرَّسة',...ds.map(d=>held(c,d).length||''),H,'','']]}])}
// ---- الإشعارات
const waNum=p=>{let n=String(p||'').replace(/[^\d+]/g,'');if(n.startsWith('+'))return n.slice(1);if(n.startsWith('00'))return n.slice(2);if(n.startsWith('0'))return '213'+n.slice(1);return n};
function noteBody(k,st){const tl=[];tl.push(`تغيّب(ت) ${st.u} ساعة غير مبررة`+(st.eq?` (منها ${st.eq} ساعة ناتجة عن ${st.l} تأخرات)`:''));if(st.streak>=2)tl.push(`وبلغ غيابه(ا) ${st.streak} أيام متتالية`);return tl.join('، ')}
function noteAction(k){return k=='استدعاء الولي'?'نستدعيكم للحضور إلى الإدارة في أقرب الآجال لتبرير غيابات ابنكم(ابنتكم) ومتابعة وضعيته الدراسية.':k=='إنذار'?'ننذركم بضرورة مواظبة ابنكم(ابنتكم) على الدراسة وتقديم مبررات غياباته، وإلا اتُّخذت في حقه الإجراءات المنصوص عليها في النظام الداخلي.':'نرجو منكم متابعة مواظبته على الدراسة وتقديم مبررات غياباته.'}
function noteText(s,st,a,b){const k=LV[st.lv],t=D.set;return`${t.school||''}\n${k} بخصوص الغياب\nإلى ولي أمر التلميذ(ة): ${s.n} — القسم: ${s.c}\nنعلمكم أنه خلال الفترة من ${a} إلى ${b} ${noteBody(k,st)}.\n${noteAction(k)}\nالمدير ${t.dir||''}`}
function sendNote(id,ch){
 const s=D.st.find(x=>x.id==id),[a,b]=period(),ds=rng(a,b),st=stat(s,ds);if(!st.lv)return;
 const k=LV[st.lv],t=D.set;
 D.nl.push({id:'n'+Date.now(),sid:id,date:today,lv:st.lv,ch,h:st.h,sk:st.streak,a,b,reply:''});save();
 if(ch=='wa'||ch=='sms'){const num=waNum(s.ph);if(num.length<9){alert('رقم هاتف الولي غير صالح أو غير مسجل');D.nl.pop();save();return}const txt=noteText(s,st,a,b);
  if(ch=='wa')window.open('https://wa.me/'+num+'?text='+encodeURIComponent(txt),'_blank');else location.href='sms:+'+num+'?body='+encodeURIComponent(txt);R();return}
 const w=window.open('','_blank');if(!w){alert('تعذر فتح نافذة الطباعة');return}
 w.document.write(`<html dir="rtl"><body style="font-family:Tahoma;padding:30px;line-height:2"><div style="text-align:center"><b>الجمهورية الجزائرية الديمقراطية الشعبية<br>وزارة التربية الوطنية</b><br>ولاية ${esc(t.wilaya)} — بلدية ${esc(t.baladiya)}<br>${esc(t.school)}</div><h2 style="text-align:center"><u>${k} بخصوص الغياب</u></h2><p>إلى السيد(ة) ولي أمر التلميذ(ة): <b>${esc(s.n)}</b><br>المولود(ة) في: ${esc(s.bd)} بـ ${esc(s.bp)} — الرقم المدرسي: ${esc(s.sn)}<br>القسم: ${esc(s.c)} — العنوان: ${esc(s.ad)} — الهاتف: ${esc(s.ph)}</p><p>نعلمكم أنه خلال الفترة من ${a} إلى ${b} ${esc(noteBody(k,st))}. ${noteAction(k)}</p><p>تحريرا في: ${today}</p><p style="text-align:left;padding-left:40px">المدير<br>${esc(t.dir)}</p><p>توقيع الولي (استلام): ...................</p><script>print()<\/script></body></html>`);w.document.close();R()}
function nlSet(id,v){const n=D.nl.find(x=>x.id==id);if(n){n.reply=v;save()}}
function nlDel(id){if(confirm('حذف هذا السجل؟')){D.nl=D.nl.filter(x=>x.id!=id);save();R()}}
const CHN={print:'طباعة',wa:'واتساب',sms:'SMS'},REPL=['','لم يرد','حضر الولي','اتصل الولي','قدّم تبريرًا'];
function v6(){
 const [a,b]=period(),ds=rng(a,b),cl=S.cls?[S.cls]:D.cls;
 const L=act().filter(s=>cl.includes(s.c)).map(s=>[s,stat(s,ds)]).filter(x=>x[1].lv).sort((x,y)=>y[1].lv-x[1].lv||y[1].h-x[1].h);
 const sm={};D.st.forEach(s=>sm[s.id]=s);
 const log=D.nl.filter(n=>sm[n.sid]&&cl.includes(sm[n.sid].c)).slice().reverse();
 $('#m').innerHTML=`<div class="card"><div class="r">${perBar(true)}</div><b>${a} → ${b}</b> (عتبات الساعات: ${D.th.join(' / ')} — عتبات الأيام المتتالية: ${D.cdTh.join(' / ')})
 <div class="t"><table style="min-width:900px"><tr><th>التلميذ</th><th>القسم</th><th>ساعات (غير مبررة)</th><th>تأخرات</th><th>أيام متتالية</th><th>المستوى</th><th>إشعارات سابقة</th><th>إرسال</th></tr>${L.map(([s,x])=>{const pv=D.nl.filter(n=>n.sid==s.id),lp=pv[pv.length-1];return`<tr><td style="text-align:right">${esc(s.n)}</td><td>${esc(s.c)}</td><td>${x.h}${x.eq?` <small>(+${x.eq} من التأخرات)</small>`:''}</td><td>${x.l}</td><td>${x.streak}</td><td><b>${LV[x.lv]}</b></td><td>${pv.length?pv.length+' — آخرها '+lp.date+' ('+LV[lp.lv]+')':'—'}</td><td style="white-space:nowrap"><button onclick="sendNote('${s.id}','print')">طباعة</button> <button onclick="sendNote('${s.id}','wa')" ${s.ph?'':'disabled'}>واتساب</button> <button onclick="sendNote('${s.id}','sms')" ${s.ph?'':'disabled'}>SMS</button></td></tr>`}).join('')||'<tr><td colspan=8>لا توجد حالات</td></tr>'}</table></div></div>
 <div class="card"><b>سجل الإشعارات المرسلة</b><div class="t"><table style="min-width:760px"><tr><th>التاريخ</th><th>التلميذ</th><th>القسم</th><th>المستوى</th><th>الوسيلة</th><th>الفترة</th><th>رد الولي</th><th></th></tr>${log.map(n=>`<tr><td>${n.date}</td><td style="text-align:right">${esc(sm[n.sid].n)}</td><td>${esc(sm[n.sid].c)}</td><td>${LV[n.lv]}</td><td>${CHN[n.ch]||''}</td><td><small>${n.a} → ${n.b}</small></td><td><select onchange="nlSet('${n.id}',this.value)">${REPL.map(r=>`<option value="${r}" ${r==n.reply?'selected':''}>${r||'— بدون رد —'}</option>`).join('')}</select></td><td><button onclick="nlDel('${n.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=8>لا توجد إشعارات مسجلة</td></tr>'}</table></div></div>`}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const withTimeout=(p,ms)=>Promise.race([Promise.resolve(p),wait(ms).then(()=>{throw new Error('timeout')})]);
function renderLoading(t){document.querySelector('#nav').innerHTML='';document.querySelector('#m').innerHTML='<div class="card" style="max-width:520px;margin:12vh auto;text-align:center"><h2 style="color:var(--ac);margin-top:0">تسيير غيابات التلاميذ</h2><p id="ld">'+t+'</p></div>'}
function renderFatal(e){document.querySelector('#nav').innerHTML='';document.querySelector('#m').innerHTML='<div class="card" style="max-width:520px;margin:8vh auto"><h2 style="color:var(--red);margin-top:0">تعذر تشغيل السيرفر المدمج</h2><p>'+esc(e)+'</p><div class="r"><button class="p" onclick="boot()">إعادة المحاولة</button></div></div>'}
async function startEmbeddedAndroidServer(){
  const cap=window.Capacitor;
  if(!(cap&&cap.isNativePlatform&&cap.isNativePlatform())) return;
  const ping=async()=>{try{const r=await withTimeout(fetch('http://127.0.0.1:8787/api/ping',{cache:'no-store'}),2000);return r.ok}catch(e){return false}};
  if(await ping()) return;
  let node=(cap.Plugins||{}).CapacitorNodeJS||(cap.Plugins||{}).NodeJS;
  if(!node&&cap.registerPlugin){try{node=cap.registerPlugin('CapacitorNodeJS')}catch(e){}}
  if(!node) throw new Error('إضافة Node.js غير موجودة داخل التطبيق');
  try{await withTimeout(node.start({}),8000)}catch(e){console.warn('Node start:',e)}
  const end=Date.now()+25000;
  while(Date.now()<end){ if(await ping()) return; await wait(500) }
  throw new Error('لم يبدأ السيرفر المدمج على الهاتف. أغلق التطبيق تمامًا ثم افتحه مجددًا.');
}
async function boot(){
  renderLoading('جارٍ تشغيل السيرفر المحلي...');
  try{await startEmbeddedAndroidServer()}catch(e){renderFatal(e.message||String(e));return}
  initServer();
}
window.addEventListener('error',e=>{if(!document.querySelector('#m').innerHTML.trim())renderFatal('خطأ: '+e.message)});
boot();
</script>
